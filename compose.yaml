---
name: ecommerce
services:
  customer-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: customer
      POSTGRES_USER: customer
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Run python3 scripts/init_env.py}"
    volumes:
    - customer-db:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U customer -d customer
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
    - ecommerce
    restart: unless-stopped
    init: true
  customer-service:
    build:
      context: "."
      dockerfile: customer-service/Dockerfile
    environment:
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:?Run python3 scripts/init_env.py}"
      JWT_ISSUER: http://localhost:8180/realms/ecommerce
      JWT_JWKS: http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs
      MONITOR_ENVIRONMENT: local
      OTEL_SERVICE_NAME: customer-service
      OTEL_RESOURCE_ATTRIBUTES: application=ecommerce,environment=local,service=customer-service,deployment.environment.name=local
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: otlp
      OTEL_TRACES_SAMPLER: always_on
      OTEL_INSTRUMENTATION_HTTP_CAPTURE_HEADERS_SERVER_REQUEST: ''
      OTEL_INSTRUMENTATION_JDBC_STATEMENT_SANITIZER_ENABLED: 'true'
      DATABASE_URL: jdbc:postgresql://customer-db:5432/customer
      DATABASE_USER: customer
      DATABASE_PASSWORD: "${DB_PASSWORD}"
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:ActiveProcessorCount=2"
      OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED: 'true'
    depends_on:
      customer-db:
        condition: service_healthy
    ports:
    - 127.0.0.1:18101:8080
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/liveness
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
    - ecommerce
    restart: unless-stopped
    init: true
  customer-db-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://customer:${DB_PASSWORD}@customer-db:5432/customer?sslmode=disable
    depends_on:
      customer-db:
        condition: service_healthy
    profiles:
    - monitoring
    networks:
    - ecommerce
    restart: unless-stopped
    init: true
  catalog-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Run python3 scripts/init_env.py}"
    volumes:
    - catalog-db:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U catalog -d catalog
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
    - ecommerce
    restart: unless-stopped
    init: true
  catalog-service:
    build:
      context: "."
      dockerfile: catalog-service/Dockerfile
    environment:
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:?Run python3 scripts/init_env.py}"
      JWT_ISSUER: http://localhost:8180/realms/ecommerce
      JWT_JWKS: http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs
      MONITOR_ENVIRONMENT: local
      OTEL_SERVICE_NAME: catalog-service
      OTEL_RESOURCE_ATTRIBUTES: application=ecommerce,environment=local,service=catalog-service,deployment.environment.name=local
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: otlp
      OTEL_TRACES_SAMPLER: always_on
      OTEL_INSTRUMENTATION_HTTP_CAPTURE_HEADERS_SERVER_REQUEST: ''
      OTEL_INSTRUMENTATION_JDBC_STATEMENT_SANITIZER_ENABLED: 'true'
      DATABASE_URL: jdbc:postgresql://catalog-db:5432/catalog
      DATABASE_USER: catalog
      DATABASE_PASSWORD: "${DB_PASSWORD}"
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:ActiveProcessorCount=2"
      OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED: 'true'
    depends_on:
      catalog-db:
        condition: service_healthy
    ports:
    - 127.0.0.1:18102:8080
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/liveness
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
    - ecommerce
    restart: unless-stopped
    init: true
  catalog-db-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://catalog:${DB_PASSWORD}@catalog-db:5432/catalog?sslmode=disable
    depends_on:
      catalog-db:
        condition: service_healthy
    profiles:
    - monitoring
    networks:
    - ecommerce
    restart: unless-stopped
    init: true
  order-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: order
      POSTGRES_USER: order
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Run python3 scripts/init_env.py}"
    volumes:
    - order-db:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U order -d order
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
    - ecommerce
    restart: unless-stopped
    init: true
  order-service:
    build:
      context: "."
      dockerfile: order-service/Dockerfile
    environment:
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:?Run python3 scripts/init_env.py}"
      JWT_ISSUER: http://localhost:8180/realms/ecommerce
      JWT_JWKS: http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs
      MONITOR_ENVIRONMENT: local
      OTEL_SERVICE_NAME: order-service
      OTEL_RESOURCE_ATTRIBUTES: application=ecommerce,environment=local,service=order-service,deployment.environment.name=local
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: otlp
      OTEL_TRACES_SAMPLER: always_on
      OTEL_INSTRUMENTATION_HTTP_CAPTURE_HEADERS_SERVER_REQUEST: ''
      OTEL_INSTRUMENTATION_JDBC_STATEMENT_SANITIZER_ENABLED: 'true'
      DATABASE_URL: jdbc:postgresql://order-db:5432/order
      DATABASE_USER: order
      DATABASE_PASSWORD: "${DB_PASSWORD}"
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:ActiveProcessorCount=2"
      OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED: 'true'
      RABBIT_HOST: rabbitmq
      RABBIT_USER: ecommerce
      RABBIT_PASSWORD: "${RABBIT_PASSWORD:?Run python3 scripts/init_env.py}"
    depends_on:
      order-db:
        condition: service_healthy
    ports:
    - 127.0.0.1:18103:8080
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/liveness
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
    - ecommerce
    restart: unless-stopped
    init: true
  order-db-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://order:${DB_PASSWORD}@order-db:5432/order?sslmode=disable
    depends_on:
      order-db:
        condition: service_healthy
    profiles:
    - monitoring
    networks:
    - ecommerce
    restart: unless-stopped
    init: true
  payment-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payment
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Run python3 scripts/init_env.py}"
    volumes:
    - payment-db:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U payment -d payment
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
    - ecommerce
    restart: unless-stopped
    init: true
  payment-migration:
    environment:
      FLYWAY_URL: jdbc:postgresql://payment-db:5432/payment
      FLYWAY_USER: payment
      FLYWAY_PASSWORD: "${DB_PASSWORD:?Run python3 scripts/init_env.py}"
    volumes:
    - "./payment-service/db/migration:/flyway/sql:ro"
    depends_on:
      payment-db:
        condition: service_healthy
    networks:
    - ecommerce
    build:
      context: "."
      dockerfile: infrastructure/database-migrations/Dockerfile
    init: true
  payment-service:
    build:
      context: "./payment-service"
    environment:
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:?Run python3 scripts/init_env.py}"
      JWT_ISSUER: http://localhost:8180/realms/ecommerce
      JWT_JWKS: http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs
      MONITOR_ENVIRONMENT: local
      OTEL_SERVICE_NAME: payment-service
      OTEL_RESOURCE_ATTRIBUTES: application=ecommerce,environment=local,service=payment-service,deployment.environment.name=local
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: otlp
      OTEL_TRACES_SAMPLER: always_on
      OTEL_INSTRUMENTATION_HTTP_CAPTURE_HEADERS_SERVER_REQUEST: ''
      OTEL_INSTRUMENTATION_JDBC_STATEMENT_SANITIZER_ENABLED: 'true'
      DATABASE_URL: postgresql://payment:${DB_PASSWORD}@payment-db:5432/payment
    depends_on:
      payment-db:
        condition: service_healthy
      payment-migration:
        condition: service_completed_successfully
    ports:
    - 127.0.0.1:18104:3000
    healthcheck:
      test:
      - CMD
      - node
      - "-e"
      - fetch('http://127.0.0.1:3000/actuator/health/liveness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
    - ecommerce
    restart: unless-stopped
    init: true
  payment-db-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://payment:${DB_PASSWORD}@payment-db:5432/payment?sslmode=disable
    depends_on:
      payment-db:
        condition: service_healthy
    profiles:
    - monitoring
    networks:
    - ecommerce
    restart: unless-stopped
    init: true
  notification-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notification
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Run python3 scripts/init_env.py}"
    volumes:
    - notification-db:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U notification -d notification
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
    - ecommerce
    restart: unless-stopped
    init: true
  notification-migration:
    environment:
      FLYWAY_URL: jdbc:postgresql://notification-db:5432/notification
      FLYWAY_USER: notification
      FLYWAY_PASSWORD: "${DB_PASSWORD:?Run python3 scripts/init_env.py}"
    volumes:
    - "./notification-service/db/migration:/flyway/sql:ro"
    depends_on:
      notification-db:
        condition: service_healthy
    networks:
    - ecommerce
    build:
      context: "."
      dockerfile: infrastructure/database-migrations/Dockerfile
    init: true
  notification-service:
    build:
      context: "./notification-service"
    environment:
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:?Run python3 scripts/init_env.py}"
      JWT_ISSUER: http://localhost:8180/realms/ecommerce
      JWT_JWKS: http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs
      MONITOR_ENVIRONMENT: local
      OTEL_SERVICE_NAME: notification-service
      OTEL_RESOURCE_ATTRIBUTES: application=ecommerce,environment=local,service=notification-service,deployment.environment.name=local
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: otlp
      OTEL_TRACES_SAMPLER: always_on
      OTEL_INSTRUMENTATION_HTTP_CAPTURE_HEADERS_SERVER_REQUEST: ''
      OTEL_INSTRUMENTATION_JDBC_STATEMENT_SANITIZER_ENABLED: 'true'
      DATABASE_URL: postgresql://notification:${DB_PASSWORD}@notification-db:5432/notification
      RABBIT_HOST: rabbitmq
      RABBIT_USER: ecommerce
      RABBIT_PASSWORD: "${RABBIT_PASSWORD:?Run python3 scripts/init_env.py}"
    depends_on:
      notification-db:
        condition: service_healthy
      notification-migration:
        condition: service_completed_successfully
    ports:
    - 127.0.0.1:18105:3000
    healthcheck:
      test:
      - CMD
      - node
      - "-e"
      - fetch('http://127.0.0.1:3000/actuator/health/liveness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
    - ecommerce
    restart: unless-stopped
    init: true
  notification-db-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://notification:${DB_PASSWORD}@notification-db:5432/notification?sslmode=disable
    depends_on:
      notification-db:
        condition: service_healthy
    profiles:
    - monitoring
    networks:
    - ecommerce
    restart: unless-stopped
    init: true
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ecommerce
      RABBITMQ_DEFAULT_PASS: "${RABBIT_PASSWORD}"
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2 +sbwt none +sbwtdcpu none +sbwtdio
        none"
    command:
    - sh
    - "-c"
    - rabbitmq-plugins enable --offline rabbitmq_prometheus && exec docker-entrypoint.sh
      rabbitmq-server
    volumes:
    - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - "-q"
      - ping
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
    - ecommerce
    restart: unless-stopped
    init: true
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command:
    - start-dev
    - "--import-realm"
    environment:
      KC_HOSTNAME: http://localhost:8180
      KC_BOOTSTRAP_ADMIN_USERNAME: bootstrap-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?Run python3 scripts/init_env.py}"
      JAVA_OPTS_KC_HEAP: "-Xms64m -Xmx256m"
      JAVA_OPTS_APPEND: "-XX:ActiveProcessorCount=2"
    volumes:
    - "./infrastructure/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro"
    - keycloak:/opt/keycloak/data
    ports:
    - 127.0.0.1:8180:8080
    networks:
    - ecommerce
    restart: unless-stopped
    init: true
  gateway:
    image: nginx:1.28-alpine
    volumes:
    - "./infrastructure/gateway/default.conf:/etc/nginx/conf.d/default.conf:ro"
    ports:
    - 127.0.0.1:18080:8080
    networks:
    - ecommerce
    restart: unless-stopped
    init: true
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
    - "--config.file=/etc/prometheus/config.yaml"
    - "--storage.tsdb.retention.time=24h"
    profiles:
    - monitoring
    volumes:
    - "./infrastructure/observability/prometheus.yaml:/etc/prometheus/config.yaml:ro"
    - prometheus:/prometheus
    ports:
    - 127.0.0.1:19090:9090
    networks:
    - ecommerce
    restart: unless-stopped
    environment:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 128MiB
    init: true
  loki:
    image: grafana/loki:3.5.3
    command:
    - "-config.file=/etc/loki/config.yaml"
    profiles:
    - monitoring
    volumes:
    - "./infrastructure/observability/loki.yaml:/etc/loki/config.yaml:ro"
    - loki:/loki
    ports:
    - 127.0.0.1:13100:3100
    networks:
    - ecommerce
    restart: unless-stopped
    environment:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 128MiB
    init: true
  tempo:
    image: grafana/tempo:2.8.2
    command:
    - "-config.file=/etc/tempo/config.yaml"
    profiles:
    - monitoring
    volumes:
    - "./infrastructure/observability/tempo.yaml:/etc/tempo/config.yaml:ro"
    - tempo:/var/tempo
    ports:
    - 127.0.0.1:13200:3200
    networks:
    - ecommerce
    restart: unless-stopped
    environment:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 128MiB
    init: true
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    command:
    - "--config=/etc/otelcol/config.yaml"
    profiles:
    - monitoring
    volumes:
    - "./infrastructure/observability/collector.yaml:/etc/otelcol/config.yaml:ro"
    ports:
    - 127.0.0.1:14318:4318
    networks:
    - ecommerce
    restart: unless-stopped
    environment:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 128MiB
    init: true
networks:
  ecommerce:
    name: ecommerce-network
volumes:
  customer-db: {}
  catalog-db: {}
  order-db: {}
  payment-db: {}
  notification-db: {}
  rabbitmq: {}
  keycloak: {}
  prometheus: {}
  loki: {}
  tempo: {}
