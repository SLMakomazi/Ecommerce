spring:
  application:
    name: catalog-service
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8180/realms/ecommerce}
          jwk-set-uri: ${JWT_JWKS:http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      service: catalog-service
      application: ecommerce
      environment: ${MONITOR_ENVIRONMENT:local}
server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
app:
  internal-key: ${INTERNAL_API_KEY}
