server {
 listen 8080;
 resolver 127.0.0.11 valid=5s ipv6=off;
 client_max_body_size 32k;
 proxy_connect_timeout 2s;
 proxy_read_timeout 10s;
 proxy_set_header X-Service-Key "";
 proxy_set_header Host $host;
 location = /health { return 200 'UP'; }
 location ~ ^/api/customers(?:/|$) { set $target customer-service:8080; proxy_pass http://$target$request_uri; }
 location ~ ^/api/products(?:/|$) { set $target catalog-service:8080; proxy_pass http://$target$request_uri; }
 location ~ ^/api/(cart|orders)(?:/|$) { set $target order-service:8080; proxy_pass http://$target$request_uri; }
 location ~ ^/api/payments(?:/|$) { set $target payment-service:3000; proxy_pass http://$target$request_uri; }
 location ~ ^/api/notifications(?:/|$) { set $target notification-service:3000; proxy_pass http://$target$request_uri; }
 location / { return 404; }
}
