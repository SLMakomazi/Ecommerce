# Mount into the existing engine as /integration/ecommerce.yml.
blast-radius:
  topology:
    application-id: ecommerce
    environment: local
    refresh-enabled: true
  lifecycle:
    application-id: ecommerce
    environment: local
  telemetry:
    prometheus:
      base-url: http://prometheus:9090
      metric-selectors:
        - http_server_requests_seconds_count
        - http_server_requests_seconds_sum
        - http_server_requests_seconds_max
        - http_client_requests_seconds_count
        - http_client_requests_seconds_sum
        - hikaricp_connections_active
        - hikaricp_connections_pending
        - hikaricp_connections_timeout_total
        - jvm_memory_used_bytes
        - process_cpu_usage
        - nodejs_heap_size_used_bytes
        - process_resident_memory_bytes
        - checkout_retries_total
        - orders_terminal_total
        - pg_up
        - rabbitmq_queue_messages_ready
    loki:
      base-url: http://loki:3100
    tempo:
      base-url: http://tempo:3200
      search-limit: 100
    health:
      endpoints:
        customer-service: http://customer-service:8080
        catalog-service: http://catalog-service:8080
        order-service: http://order-service:8080
        payment-service: http://payment-service:3000
        notification-service: http://notification-service:3000
